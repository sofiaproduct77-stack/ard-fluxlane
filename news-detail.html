<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <title>FluxLane — новость</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/platform.css">
</head>
<body class="fx-body">
    <header class="fx-header">
        <div class="fx-header-inner">
            <a href="index.html" class="fx-brand">
                <span class="fx-brand-mark">FL</span>
                <span class="fx-brand-text">
                    <span class="fx-brand-name">FluxLane</span>
                    <span class="fx-brand-tag">Новости</span>
                </span>
            </a>
            <nav class="fx-nav" aria-label="Основная навигация">
                <a href="index.html">Обзор</a>
                <a href="monitoring.html">Мониторинг</a>
                <a href="news.html">Новости</a>
                <a href="events-map.html">Карта событий</a>
                <a href="analytics.html">Аналитика потоков</a>
                <a href="traffic-analysis.html">Карта и маршруты</a>
            </nav>
            <div class="fx-header-meta">
                <time class="fx-clock" data-fx-clock></time>
            </div>

    <main class="fx-main">
        <nav class="fx-breadcrumb" aria-label="Навигация">
            <a href="index.html">Обзор</a>
            <span aria-hidden="true"> · </span>
            <a href="news.html">Новости</a>

        <article class="fx-article" id="fx-news-article">
            <p class="fx-page-desc" id="fx-news-loading">Загрузка…</p>
        </article>
    </main>

        <footer class="fx-footer">
        <div class="fx-footer-contacts" aria-label="Контакты">
            <h3 class="fx-footer-heading">Контакты</h3>
            <ul id="fx-footer-contacts-list" class="fx-footer-contact-list"></ul>
        </div>
        <div class="fx-footer-inner">
            <span>© <span id="y"></span> FluxLane</span>
            <span data-fx-footer-links></span>
        </div>
    </footer>

    <script src="src/platform-shell.js"></script>
    <script src="src/platform-footer.js"></script>
    <script src="src/utils.js"></script>
    <script src="src/news-detail-page.js"></script>
