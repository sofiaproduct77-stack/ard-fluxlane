<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FluxLane — вход</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/platform.css">
    <link rel="stylesheet" href="src/admin.css">
    <link rel="stylesheet" href="src/platform-admin.css">
</head>
<body class="fx-body fx-admin-login">
    <div class="admin-container">
        <header class="admin-header">
            <h1>Вход в админ-панель</h1>
            <p>FluxLane</p>
        </header>

        <main class="admin-main">
            <div class="login-container">
                <div class="login-form">
                    <h2>Вход в систему</h2>
                    <p>Доступ к управлению данными и настройкам FluxLane</p>
                    
                    <form id="loginForm">
                        <div class="form-group">
                            <label for="username">Имя пользователя</label>
                            <input type="text" id="username" required placeholder="admin">
                        </div>
                        
                        <div class="form-group">
                            <label for="password">Пароль</label>
                            <input type="password" id="password" required placeholder="admin123">
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-full">Войти</button>
                    </form>
                    
                    <div class="login-info">
                        <h3>Тестовые аккаунты:</h3>
                        <div class="test-accounts">
                            <div class="account">
                                <strong>Администратор:</strong> admin / admin123
                            </div>
                            <div class="account">
                                <strong>Редактор:</strong> editor / editor123
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Уведомления -->
        <div class="notifications" id="notifications"></div>
    </div>

    <script src="src/admin-login.js" defer></script>
</body>
</html>
